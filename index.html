<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פרויקטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">

<style>
  :root {
    color-scheme: light;
    direction: rtl;
    --paper: #faf8f4;
    --ink: #1b1916;
    --ink-2: #423c35;
    --muted: #6d665d;
    --rule: #e4dfd6;
    --accent: #b3202c;
    --chip: #f1ece3;

    --display: "Frank Ruhl Libre", "Noto Serif Hebrew", Georgia, serif;
    --body: "IBM Plex Sans Hebrew", "Noto Sans Hebrew", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #181612;
      --ink: #f3efe8;
      --ink-2: #d8d2c7;
      --muted: #a39b8f;
      --rule: #332f28;
      --accent: #e8676d;
      --chip: #2b281f;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #181612;
    --ink: #f3efe8;
    --ink-2: #d8d2c7;
    --muted: #a39b8f;
    --rule: #332f28;
    --accent: #e8676d;
    --chip: #2b281f;
  }

  * { box-sizing: border-box }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16.5px;
    line-height: 1.72;
    -webkit-font-smoothing: antialiased;
  }

  img { max-width: 100% }

  .wrap {
    max-width: 760px;
    margin-inline: auto;
    padding-inline: clamp(16px, 5vw, 40px);
    padding-block: clamp(56px, 11vw, 112px) 64px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .1em;
    color: var(--muted);
    margin: 0 0 16px;
    direction: ltr;
    text-align: right;
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(34px, 6vw, 48px);
    line-height: 1.14;
    margin: 0;
    text-wrap: balance;
  }

  .intro {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(17px, 2.4vw, 19.5px);
    line-height: 1.6;
    color: var(--ink-2);
    margin: 18px 0 0;
    max-width: 48ch;
  }

  /* ---------- the list of projects ---------- */
  ul.projects {
    list-style: none;
    margin: clamp(36px, 6vw, 56px) 0 0;
    padding: 0;
    border-top: 1px solid var(--rule);
  }

  ul.projects li { border-bottom: 1px solid var(--rule) }

  a.project {
    display: block;
    padding: 22px 0;
    color: inherit;
    text-decoration: none;
  }

  a.project:hover .name,
  a.project:focus-visible .name { color: var(--accent) }

  a.project:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 3px;
  }

  .name {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(20px, 3vw, 24px);
    line-height: 1.3;
    display: block;
  }

  .blurb {
    display: block;
    color: var(--ink-2);
    font-size: 15.5px;
    margin-top: 5px;
    max-width: 54ch;
  }

  .tag {
    display: inline-block;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .07em;
    color: var(--muted);
    background: var(--chip);
    border-radius: 99px;
    padding: 3px 10px;
    direction: ltr;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important }
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">yaronra.github.io</p>
  <h1>פרויקטים</h1>
  <p class="intro">
    דברים שבניתי כדי להסתכל על נתונים — בינתיים בעיקר בחירות.
  </p>

  <!-- ===================================================================
       להוספת פרויקט: שכפלו בלוק <li> אחד, והחליפו את הקישור, השם,
       התיאור והתגית. הסדר כאן הוא סדר התצוגה.
       =================================================================== -->
  <ul class="projects">

    <li>
      <a class="project" href="elections2026/">
        <span class="name">אטלס הקלפיות 2026</span>
        <span class="blurb">
          כל 12,880 הקלפיות בבחירות 2026, ממוקמות לפי האופן שבו הצביעו ולא לפי
          מיקומן — ודפדוף בין 100 היישובים הגדולים בתוך אותה מפה.
        </span>
        <span class="tag">בחירות 2026</span>
      </a>
    </li>

  </ul>
</div>

</body>
</html>
